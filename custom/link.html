<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>友链申请</title><script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css"><script src="https://cdn.jsdelivr.net/npm/element-plus/dist/index.full.min.js"></script></head><body><div id="app" style="max-width:700px;margin:40px auto"><el-card shadow="hover" style="border-radius:12px;overflow:hidden;padding-top:0"><template #header><div style="background-color:#409eff;color:#fff;padding:14px 18px;margin:-16px;border-radius:12px 12px 0 0;font-weight:600;font-size:16px">友链申请</div></template><el-form label-position="top" label-width="100%" required><el-form-item label="站点名称" required><el-input v-model="form.name" placeholder="请输入站点名称"></el-input></el-form-item><el-form-item label="站点链接" required><el-input v-model="form.url" type="url" placeholder="请输入站点链接"></el-input></el-form-item><el-form-item label="站点图标" required><el-input v-model="form.image" type="url" placeholder="请输入图标地址"></el-input></el-form-item><el-form-item label="站点描述" required><el-input v-model="form.des" placeholder="请输入站点描述"></el-input></el-form-item><el-form-item><el-checkbox v-model="form.check">确认信息真实无误</el-checkbox></el-form-item><el-form-item><el-button type="primary" @click="askFriend" style="width:100%">提交申请</el-button></el-form-item></el-form></el-card></div><script>let createApp=Vue.createApp;createApp({data(){return{form:{name:"",url:"",image:"",des:"",check:!1}}},methods:{TestUrl(e){return/http(s)?:\/\/([\w-]+\.)+[\w-]+(\/[\w- .\/?%&=]*)?/.test(e)},askFriend(){var r=this;let t=document.activeElement;if(r.form.check)if(r.form.name&&r.form.url&&r.form.image&&r.form.des)if(r.TestUrl(r.form.url))if(r.TestUrl(r.form.image)){t.classList.add("is-loading"),t.disabled=!0;var a,l={name:r.form.name,url:r.form.url,image:r.form.image,description:r.form.des};let e="";for(a in l)e+=`&${a}=`+encodeURIComponent(l[a]);e=e.slice(1),fetch("https://admin.vayfou.cn/pub/ask_friend/",{method:"POST",body:e,headers:{"Content-Type":"application/x-www-form-urlencoded"}}).then(e=>{if(e.ok)return e.json();throw new Error("请求失败")}).then(e=>{alert(e.msg)}).catch(e=>{alert("提交失败：网络异常或后台错误")}).finally(()=>{t.classList.remove("is-loading"),t.disabled=!1})}else alert("图标地址格式错误");else alert("链接格式错误");else alert("请填写完整信息");else alert("请勾选确认信息")}}}).use(ElementPlus).mount("#app")</script></body></html>
